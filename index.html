<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Market Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="mb-8 border-b border-slate-800 pb-4 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-bold text-emerald-400">BTC/USDT Live Feed</h1>
                <p class="text-slate-400 text-sm mt-1">Real-time WebSocket Ingestion</p>
            </div>
            <!-- Connection Status Indicator -->
            <div class="flex items-center gap-2">
                <div id="status-dot" class="w-3 h-3 rounded-full bg-red-500"></div>
                <span id="status-text" class="text-sm font-mono text-slate-400">Disconnected</span>
            </div>
        </header>

        <!-- Metrics Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Current Price</p>
                <p id="current-price" class="text-2xl font-mono font-bold">---</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Session Change</p>
                <p id="price-change" class="text-2xl font-mono font-bold">---</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Update Latency</p>
                <p class="text-2xl font-mono font-bold text-emerald-400">&lt; 50ms</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <!-- Updated Data Source -->
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Data Source</p>
                <p class="text-xl font-mono font-bold text-blue-400">Binance WS</p>
            </div>
        </div>

        <!-- Chart Container -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-2xl relative h-[400px]">
            <canvas id="marketChart"></canvas>
        </div>
    </div>

    <!-- Link to your JavaScript file -->
    <script src="app.js"></script>
</body>
</html>
